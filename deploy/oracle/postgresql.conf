# =============================================================================
# PostgreSQL 16 Configuration — Oracle Cloud Free Tier
# Tuned for: 8GB memory limit, ARM64 Ampere A1, SSD storage
#
# Deployed via docker-compose.oracle.yml (mounted read-only)
# =============================================================================

# ── Connections ──────────────────────────────────────────────────────────────
max_connections = 100
superuser_reserved_connections = 3

# ── Memory ───────────────────────────────────────────────────────────────────
# Container memory limit: 8GB
shared_buffers = 2GB                    # 25% of container limit
effective_cache_size = 6GB              # 75% of container limit
work_mem = 16MB                         # per-operation sort/hash memory
maintenance_work_mem = 512MB            # VACUUM, CREATE INDEX, etc.
huge_pages = try                        # use if available on ARM64

# ── WAL ──────────────────────────────────────────────────────────────────────
wal_level = replica
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ── Query Planner ────────────────────────────────────────────────────────────
random_page_cost = 1.1                  # SSD storage (no rotational penalty)
effective_io_concurrency = 200          # SSD can handle parallel I/O
default_statistics_target = 100

# ── Parallel Queries ─────────────────────────────────────────────────────────
max_worker_processes = 4                # matches OCPU count
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── Logging ──────────────────────────────────────────────────────────────────
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 500        # log queries > 500ms
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0                      # log all temp file usage

# ── Autovacuum ───────────────────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# ── pgvector tuning ──────────────────────────────────────────────────────────
# ivfflat/hnsw index building uses work_mem heavily
# Increase for index builds: SET work_mem = '512MB' before CREATE INDEX
shared_preload_libraries = 'vector'

# ── Locale ───────────────────────────────────────────────────────────────────
timezone = 'Africa/Nairobi'
lc_messages = 'en_US.UTF-8'
