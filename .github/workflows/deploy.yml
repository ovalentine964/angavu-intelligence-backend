# =============================================================================
# Angavu Intelligence Backend — CI/CD Pipeline
# Build → Push to GHCR → Deploy to Oracle Cloud Free Tier
# =============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'nginx/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/angavu-backend

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run tests
        run: cargo test --release

  # ── Build & Push Docker Image ───────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Oracle Cloud ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: production
      url: https://${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for SSH
        run: |
          for i in $(seq 1 10); do
            if ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no \
              -i /tmp/deploy_key \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "echo ok" 2>/dev/null; then
              echo "SSH ready"
              break
            fi
            echo "Attempt $i: SSH not ready, waiting..."
            sleep 10
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            export IMAGE_DIGEST="${{ needs.build.outputs.image_digest }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_NAME="${{ env.IMAGE_NAME }}"

            echo "=== Deploying ${IMAGE_TAG} ==="

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            cd /opt/angavu
            docker compose pull api

            # Run database migrations
            echo "=== Running migrations ==="
            docker compose run --rm api /app/angavu-migrate || echo "No migrations to run"

            # Restart services with zero-downtime
            echo "=== Restarting services ==="
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f --filter "until=72h"

            echo "=== Deploy complete ==="

      - name: Health Check
        run: |
          echo "Waiting for service to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
              "https://${{ secrets.DEPLOY_HOST }}/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 30 attempts"
          exit 1

      - name: Notify Success
        if: success()
        run: |
          echo "::notice::✅ Deployed ${{ needs.build.outputs.image_tag }} to production"

      - name: Notify Failure
        if: failure()
        run: |
          echo "::error::❌ Deployment failed for ${{ needs.build.outputs.image_tag }}"
