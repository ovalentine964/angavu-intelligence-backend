# =============================================================================
# Angavu Intelligence Backend — Azure Deployment Pipeline
# Build → Push to ACR → Deploy to Azure Container Apps
# Parallel to the Oracle Cloud deploy.yml
# =============================================================================

name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        type: boolean
        default: false
      rollback:
        description: 'Rollback to specific image tag (leave empty for normal deploy)'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.toml'
      - 'Dockerfile'
      - 'deploy/azure/**'

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP: angavu-api
  IMAGE_NAME: angavu-backend

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests && !inputs.rollback }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run tests
        run: cargo test --release

  # ── Build & Push to ACR ─────────────────────────────────────────────────────
  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && !inputs.rollback
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image metadata
        id: meta
        run: |
          TAG="${GITHUB_SHA::8}-$(date +%Y%m%d%H%M%S)"
          FULL_IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile.azure
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Azure Container Apps ──────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || inputs.rollback)
    environment:
      name: production-azure
      url: https://${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine image tag
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.rollback }}" ]; then
            TAG="${{ inputs.rollback }}"
            echo "mode=rollback" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ needs.build.outputs.image_tag }}"
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          fi
          FULL_IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${FULL_IMAGE} (mode: ${TAG})"

      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.resolve-tag.outputs.full_image }}

      - name: Get app URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "App URL: https://${FQDN}"

      - name: Health Check
        id: health-check
        run: |
          URL="https://${{ steps.get-url.outputs.url }}/health"
          echo "Checking: ${URL}"

          HEALTHY=false
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w '%{http_code}' "${URL}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              HEALTHY=true
              break
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Health check failed after 30 attempts"
            echo "needs_rollback=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "needs_rollback=false" >> "$GITHUB_OUTPUT"

      - name: Rollback on failure
        if: failure() && steps.health-check.outputs.needs_rollback == 'true'
        run: |
          echo "🔄 Rolling back to latest known good image..."
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          echo "Rollback triggered. Check logs for status."

      - name: Notify success
        if: success()
        run: |
          echo "::notice::✅ Deployed ${{ steps.resolve-tag.outputs.tag }} to Azure (${{ steps.resolve-tag.outputs.mode }})"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::❌ Azure deployment failed for ${{ steps.resolve-tag.outputs.tag }}. Rollback may have been attempted."
