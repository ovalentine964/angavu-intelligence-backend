# =============================================================================
# Angavu Intelligence Backend — Security Scanning Pipeline
# cargo-audit · cargo-deny · dependency-review · secret scanning
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Cargo Audit: Known vulnerability check ────────────────────────────────
  cargo-audit:
    name: cargo-audit (CVE check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: |
          cargo audit --json > audit-report.json 2>&1 || true
          cargo audit
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
          retention-days: 30

  # ── Cargo Deny: License + advisory + source check ─────────────────────────
  cargo-deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: advisories --all-features

      - name: Run cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: licenses --all-features

      - name: Run cargo deny check bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: bans --all-features

      - name: Run cargo deny check sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: sources --all-features

  # ── Dependency Review: Block PRs with vulnerable dependencies ─────────────
  dependency-review:
    name: Dependency Review (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: true

  # ── Secret Scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          echo "::group::Scanning for hardcoded secrets"
          PATTERNS=(
            'password\s*=\s*"[^"]{8,}"'
            'api[_-]?key\s*=\s*"[^"]{8,}"'
            'secret\s*=\s*"[^"]{8,}"'
            'token\s*=\s*"[^"]{8,}"'
            'BEGIN RSA PRIVATE KEY'
            'BEGIN EC PRIVATE KEY'
            'BEGIN PRIVATE KEY'
            'ghp_[a-zA-Z0-9]{36}'
            'sk-[a-zA-Z0-9]{32,}'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rniE "$pattern" src/ python/ rust-api/ --include="*.rs" --include="*.py" --include="*.toml" --include="*.env" 2>/dev/null | grep -v "test" | grep -v "example" || true)
            if [ -n "$MATCHES" ]; then
              echo "::warning::Potential secret found: $MATCHES"
              FOUND=$((FOUND + 1))
            fi
          done
          if [ "$FOUND" -gt 0 ]; then
            echo "::warning::Found $FOUND potential hardcoded secrets — review above"
          else
            echo "✅ No hardcoded secrets detected"
          fi
          echo "::endgroup::"

  # ── Docker Image Scan ─────────────────────────────────────────────────────
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: angavu-backend:scan

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'angavu-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
