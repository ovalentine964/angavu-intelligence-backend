# =============================================================================
# Staging Deployment Workflow
# Trigger: push to 'staging' branch or manual dispatch
# =============================================================================

name: Deploy Staging

on:
  push:
    branches: [staging]
    paths:
      - 'rust-api/**'
      - 'python/**'
      - 'Cargo.toml'
      - 'Dockerfile'
      - 'docker-compose.staging.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        type: boolean
        default: false
      promote_to_production:
        description: 'Promote current staging to production'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/angavu-backend

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── Test ─────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run tests
        run: cargo test --release

  # ── Build & Push Docker Image ───────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging
      url: https://staging.angavu.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            export IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            echo "=== Deploying staging ${IMAGE_TAG} ==="

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/angavu-staging
            docker compose -f docker-compose.staging.yml pull api
            docker compose -f docker-compose.staging.yml run --rm api /app/angavu-migrate || echo "No migrations"
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            docker image prune -f --filter "until=72h"
            echo "=== Staging deploy complete ==="

      - name: Health Check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
              "https://staging.angavu.com/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Staging health check failed"
          exit 1

  # ── Promote to Production ───────────────────────────────────────────────────
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: ${{ inputs.promote_to_production }}
    environment:
      name: production
      url: https://angavu.com
    steps:
      - name: Tag staging image as production
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          STAGING_TAG="${{ needs.build.outputs.image_tag }}"
          PROD_TAG="$(date +%Y%m%d-%H%M%S)-promoted"

          # Pull staging image and retag as production
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest"
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest" \
                     "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PROD_TAG}"
          docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest" \
                     "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PROD_TAG}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          echo "Promoted staging → production as ${PROD_TAG}"

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/angavu
            docker compose -f docker-compose.production.yml pull api-1 api-2 api-3
            docker compose -f docker-compose.production.yml run --rm api-1 /app/angavu-migrate || echo "No migrations"
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f --filter "until=72h"
            echo "=== Production deploy complete ==="
