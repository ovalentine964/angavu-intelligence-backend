# =============================================================================
# Angavu Intelligence Backend — Oracle Cloud Free Tier
# ARM Ampere A1: 4 OCPU, 24GB RAM, 200GB boot volume
#
# Deploy:
#   docker compose -f docker-compose.oracle.yml --env-file .env.oracle up -d
#
# Build multi-arch image:
#   docker buildx build --platform linux/arm64 -t angavu-backend:latest .
# =============================================================================

version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql://angavu:${POSTGRES_PASSWORD}@postgres:5432/angavu
  REDIS_URL: redis://redis:6379/0
  RUST_LOG: info
  ANGAVU_HOST: 0.0.0.0
  ANGAVU_PORT: 8000

services:
  # ── PostgreSQL 16 + pgvector (tuned for 24GB RAM) ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: angavu
      POSTGRES_USER: angavu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/oracle/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angavu -d angavu"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
        reservations:
          memory: 4G
          cpus: "0.5"

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M

  # ── Angavu Intelligence Backend (Rust) ──────────────────────────────────────
  api:
    image: ${IMAGE}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - apilogs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
        reservations:
          memory: 1G
          cpus: "0.5"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

volumes:
  pgdata:
  redisdata:
  apilogs:
