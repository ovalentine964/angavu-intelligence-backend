# Prometheus configuration for Angavu Intelligence Backend
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'angavu-production'
    environment: 'production'

# Alerting rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Scrape targets
scrape_configs:
  # Angavu API server
  - job_name: 'angavu-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'angavu-api'
    scrape_interval: 10s

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # ClickHouse exporter
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse-exporter:9116']
        labels:
          service: 'clickhouse'

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
