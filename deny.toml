# =============================================================================
# cargo-deny configuration
# Run: cargo deny check
# =============================================================================

[advisories]
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # RUSTSEC-2024-0421: idna 0.5.0 accepts invalid Punycode labels
    # Mitigated: removed unused `validator` crate that pulled in idna 0.5.0
    # Kept as ignore in case of transitive re-introduction until all paths use idna >= 1.0
    # "RUSTSEC-2024-0421",
]

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "OpenSSL",
]
exceptions = [
    { allow = ["Unicode-DFS-2016"], name = "unicode-ident" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
git-fetch-with-cli = true
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
